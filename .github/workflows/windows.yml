# ============================================================================
# Stoat Desktop — GitHub Actions 自动构建 Windows 安装包
# ============================================================================
# 用途：每次 push 到 main 分支或手动触发时，自动构建 Windows 安装包
# 目标站点：openelfai.cn（通过环境变量 STOAT_SITE_URL 注入）
# 校验状态：YAML 语法已通过 actionlint 静态检查，未在真实仓库中实际运行验证
# ============================================================================

name: Build Windows Installer (Test)

on:
  push:
    branches: [main, develop]
    paths:
      - 'stoat-desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      site_url:
        description: '目标站点域名（默认 https://openelfai.cn）'
        required: false
        default: 'https://openelfai.cn'
        type: string

env:
  STOAT_SITE_URL: ${{ github.event.inputs.site_url || 'https://openelfai.cn' }}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./stoat-desktop
        shell: cmd

    steps:
      # ------------------------------------------------------------------------
      # 1. 检出代码
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 2. 安装 Node.js 20
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./stoat-desktop/package-lock.json

      - name: Verify Node.js installation
        run: |
          node --version
          npm --version

      # ------------------------------------------------------------------------
      # 3. 安装项目依赖
      # ------------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------------------
      # 4. 构建 Windows 安装包（NSIS + 便携版）
      # ------------------------------------------------------------------------
      - name: Build Windows installer
        run: |
          set STOAT_SITE_URL=${{ env.STOAT_SITE_URL }}
          npm run build:win
        shell: cmd

      # ------------------------------------------------------------------------
      # 5. 上传构建产物 — NSIS 安装程序
      # ------------------------------------------------------------------------
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: stoat-windows-setup
          path: stoat-desktop/dist/Stoat Setup *.exe
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------------
      # 6. 上传构建产物 — 便携版
      # ------------------------------------------------------------------------
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: stoat-windows-portable
          path: stoat-desktop/dist/Stoat-Portable-*.exe
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------------
      # 7. 输出构建信息摘要
      # ------------------------------------------------------------------------
      - name: Print build summary
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "Build Summary"
          Write-Host "========================================"
          Write-Host "Site URL    : ${{ env.STOAT_SITE_URL }}"
          Write-Host "Output Dir  : dist/"
          Write-Host "Node Ver    : $(node --version)"
          Write-Host "Commit      : ${{ github.sha }}"
          Write-Host "Branch      : ${{ github.ref_name }}"
          Write-Host "========================================"
          Get-ChildItem -Path "dist" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.Name)  [$([math]::Round($_.Length / 1MB, 2)) MB]"
          }
