name: Build iOS IPA (Test)

on:
  push:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API Base URL'
        required: true
        default: 'https://openelfai.cn'
      build_number:
        description: 'Build Number (optional, auto-increment if empty)'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.24.0'
  XCODE_VERSION: '16.0'
  # WORKING_DIRECTORY: root

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        # working-directory: root

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Setup Flutter
      # ------------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      # ------------------------------------------------------------------
      # 3. Setup Xcode
      # ------------------------------------------------------------------
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # ------------------------------------------------------------------
      # 4. Install dependencies & CocoaPods
      # ------------------------------------------------------------------
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # ------------------------------------------------------------------
      # 5. Inject environment-specific configuration (optional)
      # ------------------------------------------------------------------
      - name: Inject backend URL
        if: github.event.inputs.backend_url != ''
        run: |
          echo "BACKEND_URL=${{ github.event.inputs.backend_url }}" >> $GITHUB_ENV
          # Uncomment if your app reads from a .env file at build time:
          # echo "API_BASE_URL=${{ github.event.inputs.backend_url }}" > .env

      # ------------------------------------------------------------------
      # 6. Configure iOS signing (GitHub Secrets)
      #
      # Required Secrets (Repository Settings -> Secrets and variables -> Actions):
      #   APPLE_DEVELOPER_CERTIFICATE_P12    : base64 encoded .p12 certificate
      #   APPLE_DEVELOPER_CERTIFICATE_PASSWORD : .p12 export password
      #   APPLE_PROVISIONING_PROFILE         : base64 encoded .mobileprovision
      #   APPLE_TEAM_ID                      : Apple Developer Team ID (e.g. ABCD123456)
      #
      # Optional Secrets (for TestFlight upload):
      #   APPLE_APPSTORECONNECT_API_KEY_ID   : App Store Connect API Key ID
      #   APPLE_APPSTORECONNECT_API_ISSUER_ID: App Store Connect API Issuer ID
      #   APPLE_APPSTORECONNECT_API_KEY_P8   : App Store Connect API private key (.p8)
      # ------------------------------------------------------------------
      - name: Install Apple Developer Certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          CERT_PASS: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        if: env.CERT_P12 != ''
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo -n "$CERT_P12" | base64 --decode -o "$CERT_PATH"

          # Create temporary keychain
          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        if: env.PROVISIONING_PROFILE != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      # ------------------------------------------------------------------
      # 7. Build iOS archive
      # ------------------------------------------------------------------
      - name: Build iOS archive (xcarchive)
        run: |
          flutter build ios --release --no-codesign

          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Stoat Test Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0.0"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ------------------------------------------------------------------
      # 8. Export IPA
      # ------------------------------------------------------------------
      - name: Export IPA
        run: |
          EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist

          cat > "$EXPORT_OPTIONS_PLIST" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.example.stoat</key>
              <string>Stoat Test Distribution</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportPath $RUNNER_TEMP/Runner \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

          ls -la $RUNNER_TEMP/Runner/
          mv $RUNNER_TEMP/Runner/*.ipa $RUNNER_TEMP/Stoat-iOS-Test.ipa

      # ------------------------------------------------------------------
      # 9. Upload IPA as artifact
      # ------------------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stoat-ios-test-ipa
          path: ${{ runner.temp }}/Stoat-iOS-Test.ipa
          retention-days: 30

      # ------------------------------------------------------------------
      # 10. Upload to TestFlight (Optional)
      #
      # This step requires App Store Connect API credentials.
      # To generate an API key:
      #   1. Log in to App Store Connect (https://appstoreconnect.apple.com)
      #   2. Go to Users and Access -> Keys
      #   3. Click "+" to create a new key with "App Manager" role
      #   4. Download the .p8 file (you can only download it once)
      #   5. Note the Key ID and Issuer ID
      #   6. Store them as GitHub Secrets (see step 6 comments)
      # ------------------------------------------------------------------
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_APPSTORECONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_APPSTORECONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_APPSTORECONNECT_API_KEY_P8 }}
        if: env.API_KEY_ID != '' && env.API_ISSUER_ID != '' && env.API_KEY_P8 != ''
        run: |
          # Write API key to temporary file
          API_KEY_PATH=$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8
          echo "$API_KEY_P8" > "$API_KEY_PATH"

          # Install xcrun altool (included with Xcode) or use transporter
          xcrun altool --validate-app \
            -f "$RUNNER_TEMP/Stoat-iOS-Test.ipa" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --verbose

          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/Stoat-iOS-Test.ipa" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --verbose

      # ------------------------------------------------------------------
      # 11. Cleanup (optional - keychain is ephemeral on GitHub runners)
      # ------------------------------------------------------------------
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
